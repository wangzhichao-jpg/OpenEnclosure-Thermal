name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (TLS enabled)
        run: python -m pip install -e ".[test]" switchgear-thermal-model
      - name: Tests
        run: python -m pytest -q
      - name: Example end-to-end
        run: |
          oet init demo
          oet analyze-test demo/switchgear_test/switchgear_test.yaml --compare R1:R2 -o out_test
          oet ventilate demo/box_ventilation/box_ventilation.yaml -o out_box
      - name: Release guard
        run: oet check-release .
